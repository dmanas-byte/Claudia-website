[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/optin-1404"
  to = "/#challenge"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
