<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Claudia Gadelha — The Walkout</title>
    <style>html,body{background:#07070a;margin:0}</style>
    <script>
      // GitHub Pages SPA fallback: send unknown paths to the app, keeping the path
      (function () {
        var p = window.location.pathname;
        if (p.indexOf('/optin-1404') === 0) { window.location.replace('/#apply'); return; }
        window.location.replace('/?p=' + encodeURIComponent(p) + window.location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
